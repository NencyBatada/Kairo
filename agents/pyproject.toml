[project]
name = "kairo-agents"
version = "0.1.0"
description = "Kairo agent service: the Sense, Plan, Create, Check, Prove and Learn agents, and Ask Kairo."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.11.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-genai>=2.29.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "pillow>=12.3.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
