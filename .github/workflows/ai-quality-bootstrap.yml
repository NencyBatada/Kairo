name: AI quality bootstrap

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ai-quality-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live:
    if: github.event.pull_request.number == 31 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ai-quality-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      KAIRO_EVAL_PROJECT: ${{ vars.KAIRO_EVAL_PROJECT }}
      KAIRO_EVAL_SERVICE_ACCOUNT: ${{ vars.KAIRO_EVAL_SERVICE_ACCOUNT }}
      KAIRO_EVAL_PROVIDER: ${{ vars.KAIRO_EVAL_PROVIDER }}
      KAIRO_EVAL_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.12.5'
          enable-cache: false
      - run: uv sync --locked
        working-directory: agents
      - name: Load development model settings
        shell: pwsh
        run: |
          Import-Module ./deploy/Kairo.Deploy -Force
          $environment = Get-KairoEnvironment -Name development
          if ($environment.Project -ne $env:KAIRO_EVAL_PROJECT) { throw 'Evaluation project differs from development.' }
          foreach ($entry in (Get-KairoAgentModels -Environment $environment).GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV
          }
      - name: Initialize failure artifact before authentication
        working-directory: agents
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path
          from kairo_agents.evaluation.fixtures import Fixtures
          from kairo_agents.evaluation.runner import prompt_manifest
          path = Path('../TestResults/evaluation-live')
          path.mkdir(parents=True, exist_ok=True)
          data = {'liveEvaluationPassed': False, 'failures': ['live_job_incomplete'],
                  'commit': os.environ['KAIRO_EVAL_COMMIT'], 'fixtureManifest': Fixtures().manifest,
                  'promptManifest': prompt_manifest()}
          (path / 'report.json').write_text(json.dumps(data, indent=2), encoding='utf-8')
          PY
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.KAIRO_EVAL_PROVIDER }}
          service_account: ${{ vars.KAIRO_EVAL_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: uv run python -m kairo_agents.evaluation --live --output ../TestResults/evaluation-live
        working-directory: agents
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-quality-bootstrap-${{ github.event.pull_request.head.sha }}
          path: TestResults/evaluation-live/
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: live
    if: always() && github.event.pull_request.number == 31 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/ai-quality-tests'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LIVE_RESULT: ${{ needs.live.result }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.HEAD_SHA,
              context: 'AI quality / live', state: process.env.LIVE_RESULT === 'success' ? 'success' : 'failure',
              description: process.env.LIVE_RESULT === 'success' ? 'All live quality gates passed' : 'Live evaluation failed, was cancelled or did not complete',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
