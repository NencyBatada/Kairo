name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build core/Kairo.slnx
      - run: dotnet test --solution core/Kairo.slnx --no-build

  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run python -m kairo_agents.evaluation --offline --output ../TestResults/evaluation-offline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-quality-offline-${{ github.sha }}
          path: TestResults/evaluation-offline/
          if-no-files-found: error
          retention-days: 14

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/lib/core-api/schema.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:a11y
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: accessibility-${{ github.sha }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: error
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/scripts/ai-quality-policy.test.cjs
      - name: Validate production collector configuration
        run: docker run --rm -e GOOGLE_CLOUD_PROJECT=kairo-test -v "$PWD/deploy/Kairo.Deploy/collector.yaml:/etc/otel/config.yaml:ro" us-docker.pkg.dev/cloud-ops-agents-artifacts/google-cloud-opentelemetry-collector/otelcol-google:0.162.0 validate --config=/etc/otel/config.yaml
      - shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path deploy/tests -CI -Output Detailed
